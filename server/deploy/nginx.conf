# /etc/nginx/sites-available/permtransport
# Замените DOMAIN на свой домен (см. README). Блок HTTPS добавит certbot.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/permtransport;
    index index.html;

    # --- шлюз доступа (Flask за gunicorn) ---
    location = /auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location ~ ^/(login|logout|admin|gate-static) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Иконки нужны странице входа и iOS при «Добавить на Домой» — без пароля
    location /assets/icons/ {
        expires 7d;
    }

    # --- всё остальное только после входа ---
    location / {
        auth_request /auth;
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location @login {
        return 302 /login;
    }

    location ~ /\. { deny all; }
    location ^~ /server/ { deny all; }
    location ^~ /design/ { deny all; }
    location ^~ /tools/  { deny all; }
}
